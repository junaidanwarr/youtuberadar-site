# Copy this file into the DATA repository as .github/workflows/push-to-site.yml
#
# It copies the data repo's niches/ and templates/ folders into the website
# repo's content/ folder and commits. The website host then rebuilds.
#
# One-time setup in the DATA repo:
#   Settings -> Secrets and variables -> Actions -> New repository secret
#   Name:  SITE_REPO_TOKEN
#   Value: a fine-grained personal access token limited to the website repo,
#          with "Contents: Read and write" and nothing else.
name: Push content to website

on:
  push:
    branches: [main]
    paths: ['niches/**', 'templates/**']
  workflow_dispatch:

concurrency:
  group: push-to-site
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out data repo
        uses: actions/checkout@v4
        with:
          path: data

      - name: Check out website repo
        uses: actions/checkout@v4
        with:
          repository: junaidanwarr/youtuberadar-site
          token: ${{ secrets.SITE_REPO_TOKEN }}
          path: site

      - name: Mirror records (deletes on the site what was deleted here)
        run: |
          mkdir -p site/content/niches site/content/templates
          rsync -a --delete --include='*.json' --include='.gitkeep' --exclude='*' data/niches/ site/content/niches/
          rsync -a --delete --include='*.json' --include='.gitkeep' --exclude='*' data/templates/ site/content/templates/
          touch site/content/niches/.gitkeep site/content/templates/.gitkeep

      - name: Validate by building the site
        working-directory: site
        run: |
          npm ci
          npm run build

      - name: Commit and push
        working-directory: site
        run: |
          git config user.name "youtuberadar-data-bot"
          git config user.email "youtuberadar-data-bot@users.noreply.github.com"
          git add content
          if git diff --cached --quiet; then
            echo "No content changes."
          else
            git commit -m "content: sync from data repo @ ${GITHUB_SHA::7}"
            git push
          fi
